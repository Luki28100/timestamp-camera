// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Build output goes outside the project directory. Cloud-synced folders can turn
// idle files into placeholders, which Gradle cannot read back as regular files.
// Override the location with TIMESTAMP_CAMERA_BUILD_DIR.
def buildRoot = System.getenv("TIMESTAMP_CAMERA_BUILD_DIR")
    ?: (System.getenv("LOCALAPPDATA") ? "${System.getenv('LOCALAPPDATA')}/TimestampCamera-build" : null)

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    if (buildRoot) {
        layout.buildDirectory = new File("${buildRoot}/${project.name}")
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
